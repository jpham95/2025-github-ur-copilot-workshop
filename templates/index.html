<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pomodoro Timer</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <div class="timer-card">
            <h1 class="timer-title">Pomodoro Timer</h1>
            
            <div class="status">In Progress</div>
            
            <div class="timer-circle">
                <svg class="progress-ring" width="200" height="200">
                    <circle class="progress-ring-bg" cx="100" cy="100" r="80" />
                    <circle class="progress-ring-fill" cx="100" cy="100" r="80" />
                </svg>
                <div class="timer-display" id="timerDisplay">25:00</div>
            </div>
            
            <div class="timer-controls">
                <button class="btn btn-start" id="startBtn">Start</button>
                <button class="btn btn-reset" id="resetBtn">Reset</button>
            </div>
            
            <div class="progress-section">
                <h2 class="progress-title">Today's Progress</h2>
                <div class="progress-stats">
                    <div class="stat">
                        <div class="stat-number" id="completedSessions">0</div>
                        <div class="stat-label">Completed</div>
                    </div>
                    <div class="stat">
                        <div class="stat-number" id="focusTime">0 min</div>
                        <div class="stat-label">Focus Time</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
